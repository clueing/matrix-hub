<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="mhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0f172a" stroke="url(#mhGrad)" stroke-width="1.5" />

  <!-- Matrix connection lines -->
  <g stroke="url(#mhGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="24" y1="24" x2="24" y2="11" />
    <line x1="24" y1="24" x2="35" y2="18" />
    <line x1="24" y1="24" x2="35" y2="30" />
    <line x1="24" y1="24" x2="24" y2="37" />
    <line x1="24" y1="24" x2="13" y2="30" />
    <line x1="24" y1="24" x2="13" y2="18" />
    
    <!-- Outer perimeter polygon connecting matrix points -->
    <polygon points="24,11 35,18 35,30 24,37 13,30 13,18" fill="none" stroke="url(#mhGrad)" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />
  </g>

  <!-- Matrix outer nodes -->
  <circle cx="24" cy="11" r="3" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="35" cy="18" r="3" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="35" cy="30" r="3" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="24" cy="37" r="3" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="13" cy="30" r="3" fill="url(#nodeGrad)" filter="url(#glow)" />
  <circle cx="13" cy="18" r="3" fill="url(#nodeGrad)" filter="url(#glow)" />

  <!-- Central Hub Core -->
  <circle cx="24" cy="24" r="5" fill="url(#mhGrad)" filter="url(#glow)" />
  <circle cx="24" cy="24" r="2.2" fill="#ffffff" />
</svg>
